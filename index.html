<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공튀기기</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: #12141c;
    color: #e8eaf2;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: 0.02em; }
  #stage { position: relative; }
  canvas {
    display: block;
    background: #1b1e2b;
    border-radius: 10px;
    border: 1px solid #2c3145;
    cursor: crosshair;
  }
  .hint { margin: 0; font-size: 13px; color: #8b93ab; }

  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border-radius: 10px;
    background: rgba(12, 14, 20, 0.82);
  }
  #overlay[hidden] { display: none; }
  #overlay h2 { margin: 0 0 4px; font-size: 34px; letter-spacing: 0.04em; color: #ff6b6b; }
  #overlay p { margin: 0; font-size: 16px; color: #b9c0d4; }
  #overlay strong { color: #e8eaf2; font-size: 20px; }
  #newRecord { color: #ffd166; font-weight: 600; }
  #newRecord[hidden] { display: none; }
  #restart {
    margin-top: 14px;
    padding: 11px 30px;
    font: inherit;
    font-weight: 600;
    color: #12141c;
    background: #5b8cff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  #restart:hover { background: #7ba3ff; }
</style>
</head>
<body>
  <h1>공튀기기</h1>
  <div id="stage">
    <canvas id="game" width="800" height="600"></canvas>
    <div id="overlay" hidden>
      <h2>게임 오버</h2>
      <p>점수 <strong id="finalScore">0</strong></p>
      <p>최고 점수 <span id="finalHi">0</span></p>
      <p id="newRecord" hidden>새 기록!</p>
      <button id="restart">다시하기</button>
    </div>
  </div>
  <p class="hint">화면을 클릭해 공을 소환하고, ← → 또는 A / D 키로 바를 움직이세요 (공 최대 5개)</p>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const finalScoreEl = document.getElementById('finalScore');
  const finalHiEl = document.getElementById('finalHi');
  const newRecordEl = document.getElementById('newRecord');
  const restartBtn = document.getElementById('restart');

  const W = canvas.width;
  const H = canvas.height;

  // ── 설정값 ──────────────────────────────────────────────
  const BAR = {
    width: 120,
    height: 14,
    speed: 520,          // px/s
    y: H - 48,
  };

  const BALL = {
    radius: 9,
    speed: 340,          // px/s (등속)
    maxCount: 5,
    maxBounceAngle: Math.PI / 3,   // 바 끝에 맞았을 때 튕기는 각도(60°)
  };

  const HI_SCORE_KEY = 'ballBounce.hiScore';

  // ── 상태 ────────────────────────────────────────────────
  const bar = { x: W / 2 - BAR.width / 2 };
  const balls = [];
  const keys = new Set();

  const state = {
    playing: true,
    score: 0,
    hiScore: loadHiScore(),
  };

  // ── Hi-Score 저장 ───────────────────────────────────────
  function loadHiScore() {
    try {
      return Number(localStorage.getItem(HI_SCORE_KEY)) || 0;
    } catch {
      return 0;   // 시크릿 모드 등에서 접근이 막힌 경우
    }
  }

  function saveHiScore(value) {
    try {
      localStorage.setItem(HI_SCORE_KEY, String(value));
    } catch {
      /* 저장 실패해도 게임은 계속된다 */
    }
  }

  // ── 입력 ────────────────────────────────────────────────
  const MOVE_KEYS = ['ArrowLeft', 'ArrowRight', 'a', 'A', 'd', 'D'];
  const normalize = (key) => (key.length === 1 ? key.toLowerCase() : key);

  window.addEventListener('keydown', (e) => {
    if (MOVE_KEYS.includes(e.key)) {
      keys.add(normalize(e.key));
      e.preventDefault();
    }
  });

  window.addEventListener('keyup', (e) => {
    keys.delete(normalize(e.key));
  });

  function movingLeft()  { return keys.has('ArrowLeft')  || keys.has('a'); }
  function movingRight() { return keys.has('ArrowRight') || keys.has('d'); }

  canvas.addEventListener('click', (e) => {
    if (!state.playing) return;

    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (W / rect.width);
    const y = (e.clientY - rect.top) * (H / rect.height);
    spawnBall(x, y);
  });

  restartBtn.addEventListener('click', restart);

  // ── 공 ──────────────────────────────────────────────────
  function spawnBall(x, y) {
    if (balls.length >= BALL.maxCount) return;

    // 바 아래에서 소환되면 즉시 놓친 것이 되므로 위쪽으로 올려준다
    const spawnY = Math.min(y, BAR.y - BALL.radius * 3);
    const angle = (Math.random() * 0.6 + 0.2) * Math.PI;  // 아래 방향 대각선
    balls.push({
      x: Math.max(BALL.radius, Math.min(W - BALL.radius, x)),
      y: Math.max(BALL.radius, spawnY),
      vx: Math.cos(angle) * BALL.speed,
      vy: Math.abs(Math.sin(angle)) * BALL.speed,
    });
  }

  function bounceOffBar(ball) {
    // 바 중앙에서 얼마나 떨어진 곳에 맞았는지 (-1 왼쪽 끝 ~ +1 오른쪽 끝)
    const offset = (ball.x - (bar.x + BAR.width / 2)) / (BAR.width / 2);
    const angle = Math.max(-1, Math.min(1, offset)) * BALL.maxBounceAngle;

    ball.vx = Math.sin(angle) * BALL.speed;
    ball.vy = -Math.cos(angle) * BALL.speed;
    ball.y = BAR.y - BALL.radius;

    state.score += 1;
  }

  function hitsBar(ball, prevY) {
    if (ball.vy <= 0) return false;

    const crossed = prevY + BALL.radius <= BAR.y && ball.y + BALL.radius >= BAR.y;
    if (!crossed) return false;

    return ball.x + BALL.radius >= bar.x && ball.x - BALL.radius <= bar.x + BAR.width;
  }

  // ── 게임 진행 ───────────────────────────────────────────
  function gameOver() {
    state.playing = false;

    const isNewRecord = state.score > state.hiScore;
    if (isNewRecord) {
      state.hiScore = state.score;
      saveHiScore(state.hiScore);
    }

    finalScoreEl.textContent = state.score;
    finalHiEl.textContent = state.hiScore;
    newRecordEl.hidden = !isNewRecord;
    overlay.hidden = false;
  }

  function restart() {
    balls.length = 0;
    bar.x = W / 2 - BAR.width / 2;
    state.score = 0;
    state.playing = true;
    overlay.hidden = true;
  }

  function update(dt) {
    if (!state.playing) return;

    let dir = 0;
    if (movingLeft())  dir -= 1;
    if (movingRight()) dir += 1;

    bar.x += dir * BAR.speed * dt;
    bar.x = Math.max(0, Math.min(W - BAR.width, bar.x));

    for (const ball of balls) {
      const prevY = ball.y;

      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;

      // 좌우 벽 반사
      if (ball.x - BALL.radius <= 0) {
        ball.x = BALL.radius;
        ball.vx = Math.abs(ball.vx);
      } else if (ball.x + BALL.radius >= W) {
        ball.x = W - BALL.radius;
        ball.vx = -Math.abs(ball.vx);
      }

      // 천장 반사
      if (ball.y - BALL.radius <= 0) {
        ball.y = BALL.radius;
        ball.vy = Math.abs(ball.vy);
      }

      if (hitsBar(ball, prevY)) bounceOffBar(ball);

      // 하단을 지나치면 게임 오버 (공 하나라도 놓치면 끝)
      if (ball.y - BALL.radius > H) {
        gameOver();
        return;
      }
    }
  }

  // ── 그리기 ──────────────────────────────────────────────
  function drawHud() {
    ctx.font = '600 18px system-ui, sans-serif';
    ctx.textBaseline = 'top';

    ctx.fillStyle = '#e8eaf2';
    ctx.textAlign = 'left';
    ctx.fillText('점수 ' + state.score, 20, 18);

    ctx.fillStyle = '#8b93ab';
    ctx.textAlign = 'right';
    ctx.fillText('HI ' + state.hiScore, W - 20, 18);

    ctx.textAlign = 'center';
    ctx.fillText('공 ' + balls.length + ' / ' + BALL.maxCount, W / 2, 18);
  }

  function drawBar() {
    ctx.fillStyle = '#5b8cff';
    ctx.beginPath();
    ctx.roundRect(bar.x, BAR.y, BAR.width, BAR.height, 7);
    ctx.fill();
  }

  function drawBalls() {
    ctx.fillStyle = '#ffd166';
    for (const ball of balls) {
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, BALL.radius, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    drawHud();
    drawBar();
    drawBalls();
  }

  // ── 게임 루프 ───────────────────────────────────────────
  let last = performance.now();

  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.05); // 탭 전환 시 튀는 것 방지
    last = now;

    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);

  // 디버그용: 브라우저 콘솔에서 __game.balls 등으로 상태 확인
  window.__game = { BAR, BALL, bar, balls, state, spawnBall, update, restart };
})();
</script>
</body>
</html>
